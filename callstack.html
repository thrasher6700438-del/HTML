<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h2>JS Functions</h2>
<P>Do a calculation then display the result</P>
<P id="demo"></P>
<script>
 add(a,b) {
    return a + b;
}
function average(a,b) {
  return add(a,b) / 2;
}
let result = average(10,20);

document.getElementById("demo").innerHTML = result;
</script>
</body>
</html>
