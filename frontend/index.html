<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strength SMP | License System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-[#02040a] text-white overflow-hidden">

    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>

    <div id="login-screen"
        class="fixed inset-0 z-[100] flex items-center justify-center bg-[#02040a] transition-all duration-700">
        <div
            class="login-card p-12 w-full max-w-md border border-white/5 rounded-[32px] bg-white/[0.01] backdrop-blur-3xl text-center relative overflow-hidden">
            <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-600/20 blur-[80px]"></div>

            <div class="relative z-10">
                <div
                    class="inline-flex p-5 rounded-2xl bg-gradient-to-br from-blue-600 to-cyan-500 mb-6 shadow-[0_0_30px_rgba(37,99,235,0.4)]">
                    <i class="fas fa-shield-halved text-3xl text-white"></i>
                </div>
                <h1
                    class="text-4xl font-black tracking-tighter bg-gradient-to-b from-white to-blue-400 bg-clip-text text-transparent mb-2">
                    Strength SMP</h1>
                <p class="text-[10px] text-white/30 uppercase tracking-[0.5em] mb-10">Secure License Core</p>

                <div class="space-y-4 text-left">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-blue-400 ml-2 uppercase">Operator Identity</label>
                        <input type="text" id="login-username" placeholder="admin" class="modern-input">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-blue-400 ml-2 uppercase">Access Token</label>
                        <input type="password" id="login-password" placeholder="••••••••" class="modern-input">
                    </div>
                    <button onclick="login()" class="login-btn">AUTHORIZE SESSION</button>
                </div>
            </div>
        </div>
    </div>

    <div id="dashboard" class="opacity-0 pointer-events-none transition-all duration-1000 flex h-screen translate-y-10">
        <aside class="w-[300px] border-r border-white/5 bg-[#05070f] p-8 flex flex-col relative">
            <div class="flex items-center gap-3 mb-12">
                <div
                    class="h-10 w-10 rounded-xl bg-gradient-to-br from-blue-600 to-blue-400 flex items-center justify-center font-black text-xl shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                    S</div>
                <h2 class="font-black text-2xl tracking-tighter uppercase">Strength</h2>
            </div>

            <nav class="flex-1 space-y-2">
                <button onclick="showPage('overview')" id="nav-overview" class="nav-link active"><i
                        class="fas fa-layer-group"></i> Overview</button>
                <button onclick="showPage('licenses')" id="nav-licenses" class="nav-link"><i
                        class="fas fa-terminal"></i> Key Registry</button>
                <button onclick="showPage('profile')" id="nav-profile" class="nav-link"><i
                        class="fas fa-fingerprint"></i> My Profile</button>
                <button onclick="showPage('settings')" id="nav-settings" class="nav-link"><i class="fas fa-command"></i>
                    System Settings</button>
            </nav>

            <button onclick="logout()"
                class="mt-auto p-4 rounded-2xl text-red-500/50 hover:text-red-400 hover:bg-red-500/5 transition-all font-bold text-xs tracking-widest uppercase">
                <i class="fas fa-power-off mr-2"></i> Terminate Session
            </button>
        </aside>

        <main
            class="flex-1 overflow-y-auto p-12 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-blue-900/10 via-transparent to-transparent">
            <header class="flex justify-between items-end mb-16">
                <div>
                    <h1 id="page-title" class="text-7xl font-black tracking-tighter leading-none mb-2">Overview</h1>
                    <p class="text-blue-500 font-bold text-xs uppercase tracking-[0.3em]">Management Console Active</p>
                </div>
                <button onclick="generateKey()" class="action-btn-primary">GENERATE NEW LICENSE</button>
            </header>

            <div id="page-overview" class="page-content grid grid-cols-3 gap-6">
                <div class="stat-card border-b-4 border-b-blue-600">
                    <p class="stat-label">Registered Keys</p>
                    <h3 id="stat-total" class="stat-value">0</h3>
                </div>
                <div class="stat-card border-b-4 border-b-emerald-500">
                    <p class="stat-label">Nodes Online</p>
                    <h3 class="stat-value">12</h3>
                </div>
                <div class="stat-card border-b-4 border-b-cyan-400">
                    <p class="stat-label">Encryption</p>
                    <h3 class="stat-value">AES-256</h3>
                </div>
            </div>

            <div id="page-licenses" class="page-content hidden">
                <div class="card overflow-hidden border-white/10">
                    <table class="w-full text-left">
                        <thead class="bg-white/5 text-[10px] uppercase font-black tracking-[0.2em] text-blue-400">
                            <tr>
                                <th class="p-6">Account ID</th>
                                <th class="p-6">Access Key</th>
                                <th class="p-6">Status</th>
                                <th class="p-6 text-right">Registry Actions</th>
                            </tr>
                        </thead>
                        <tbody id="key-table-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="page-settings" class="page-content hidden grid grid-cols-2 gap-4" id="settings-grid">
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
