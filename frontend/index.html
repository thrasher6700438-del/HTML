<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugin License System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-[#02040a] text-white overflow-hidden">

    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>

    <div id="auth-layer" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#02040a]">
        <div id="login-box" class="w-full max-w-md p-10 card text-center">
            <h1 class="text-3xl font-black tracking-tighter mb-8 italic uppercase">PLUGIN <span
                    class="text-blue-500">SYSTEM</span></h1>
            <div class="space-y-4 text-left">
                <input type="text" id="user" placeholder="Operator ID (admin)" class="modern-input">
                <input type="password" id="pass" placeholder="Access Token (admin123)" class="modern-input">
                <button onclick="handleLogin()" class="login-btn">AUTHORIZE SESSION</button>
            </div>
        </div>
        <div id="intro-box" class="hidden text-center">
            <h2 class="text-[10px] font-bold tracking-[1.2em] text-blue-500 mb-2 animate-pulse uppercase">Initializing
            </h2>
            <h1 class="text-6xl font-black italic tracking-tighter">MADE BY SEZ</h1>
        </div>
    </div>

    <div id="dashboard" class="hidden flex h-screen opacity-0 transition-opacity duration-1000">
        <aside class="w-[280px] bg-[#05070f] border-r border-white/5 p-8 flex flex-col">
            <div class="mb-12 flex items-center gap-3">
                <div id="side-pfp"
                    class="h-10 w-10 bg-blue-600 rounded-xl flex items-center justify-center font-black text-xl overflow-hidden">
                    <span id="side-pfp-init">P</span>
                </div>
                <span class="font-black text-xl tracking-tighter uppercase italic">Nexus</span>
            </div>
            <nav class="flex-1 space-y-2">
                <button onclick="showPage('overview')" class="nav-link active w-full"
                    id="btn-overview">Overview</button>
                <button onclick="showPage('licenses')" class="nav-link w-full" id="btn-licenses">Registry</button>
                <button onclick="showPage('profile')" class="nav-link w-full" id="btn-profile">Profile</button>
                <button onclick="showPage('settings')" class="nav-link w-full" id="btn-settings">Settings</button>
            </nav>
        </aside>

        <main class="flex-1 p-12 overflow-y-auto">
            <header class="flex justify-between items-end mb-16">
                <div>
                    <h1 id="title" class="text-7xl font-black tracking-tighter mb-2 italic">Overview</h1>
                    <p class="text-blue-500 font-bold text-[10px] uppercase tracking-[0.4em]">v2.5 Stable</p>
                </div>
                <button onclick="addKey()" class="action-btn-primary">GENERATE KEY</button>
            </header>

            <div id="page-overview" class="page-content animate-page grid grid-cols-3 gap-6">
                <div class="stat-card">
                    <p class="stat-label">Total Keys</p>
                    <h3 id="key-count" class="stat-value">0</h3>
                </div>
            </div>

            <div id="page-licenses" class="page-content hidden animate-page">
                <div class="card overflow-hidden">
                    <table class="w-full text-left">
                        <tbody id="key-list"></tbody>
                    </table>
                </div>
            </div>

            <div id="page-profile" class="page-content hidden animate-page max-w-4xl mx-auto">
                <div class="grid grid-cols-3 gap-6">
                    <div class="card p-8 text-center">
                        <div class="relative group mx-auto w-24 h-24 mb-4">
                            <div id="main-pfp"
                                class="w-full h-full bg-blue-600 rounded-3xl flex items-center justify-center text-3xl font-black overflow-hidden">
                                <span id="main-pfp-init">S</span>
                            </div>
                            <label
                                class="absolute inset-0 flex items-center justify-center bg-black/60 rounded-3xl opacity-0 group-hover:opacity-100 transition-opacity pointer-events-auto">
                                <i class="fas fa-camera"></i>
                                <input type="file" id="pfp-upload" class="hidden" accept="image/*"
                                    onchange="updatePFP(this)">
                            </label>
                        </div>
                        <input type="text" id="op-name" value="Sez"
                            class="bg-transparent text-2xl font-black italic text-center w-full outline-none"
                            oninput="updateName(this.value)">
                    </div>
                </div>
            </div>

            <div id="page-settings" class="page-content hidden animate-page grid grid-cols-2 gap-4 pb-20"></div>
        </main>
    </div>

    <div class="fixed bottom-6 right-6 z-[110]">
        <div id="chat-window" class="hidden w-80 h-96 card mb-4 flex flex-col overflow-hidden border-blue-500/30">
            <div class="p-4 bg-white/5 border-b border-white/5 text-[10px] font-black uppercase">Nexus Assistant</div>
            <div id="chat-msgs" class="flex-1 p-4 overflow-y-auto space-y-2 text-xs"></div>
            <input type="text" id="chat-in" class="bg-white/5 p-3 outline-none border-t border-white/5"
                placeholder="Ask anything..." onkeydown="if(event.key==='Enter') sendChat()">
        </div>
        <button onclick="toggleChat()"
            class="h-16 w-16 bg-blue-600 rounded-2xl flex items-center justify-center text-xl shadow-lg hover:scale-110 transition-transform">
            <i class="fas fa-robot"></i>
        </button>
    </div>

    <script src="script.js"></script>
</body>

</html>
