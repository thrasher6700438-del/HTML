<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mini 3D FPS Arena</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        canvas {
            display: block;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            margin-left: -5px;
            margin-top: -5px;
            background: red;
            border-radius: 50%;
            z-index: 10;
        }

        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="crosshair"></div>
    <div id="score">Score: 0</div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/PointerLockControls.js"></script>
    <script>
        let scene, camera, renderer, controls;
        let bullets = [], enemies = [];
        let clock = new THREE.Clock();
        let score = 0;

        // Scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        // Camera
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 10);

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Controls
        controls = new THREE.PointerLockControls(camera, renderer.domElement);
        document.body.addEventListener('click', () => { controls.lock(); });

        // Lighting
        let light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 7);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // Floor
        let floorGeo = new THREE.PlaneGeometry(50, 50);
        let floorMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
        let floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Walls
        let wallGeo = new THREE.BoxGeometry(50, 5, 1);
        let wallMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
        let wall1 = new THREE.Mesh(wallGeo, wallMat); wall1.position.set(0, 2.5, -25);
        let wall2 = new THREE.Mesh(wallGeo, wallMat); wall2.position.set(0, 2.5, 25);
        let wall3 = new THREE.Mesh(new THREE.BoxGeometry(1, 5, 50), wallMat); wall3.position.set(-25, 2.5, 0);
        let wall4 = new THREE.Mesh(new THREE.BoxGeometry(1, 5, 50), wallMat); wall4.position.set(25, 2.5, 0);
        scene.add(wall1, wall2, wall3, wall4);

        // Player movement
        let move = { forward: false, backward: false, left: false, right: false };
        document.addEventListener('keydown', e => {
            if (e.code == 'KeyW') move.forward = true;
            if (e.code == 'KeyS') move.backward = true;
            if (e.code == 'KeyA') move.left = true;
            if (e.code == 'KeyD') move.right = true;
        });
        document.addEventListener('keyup', e => {
            if (e.code == 'KeyW') move.forward = false;
            if (e.code == 'KeyS') move.backward = false;
            if (e.code == 'KeyA') move.left = false;
            if (e.code == 'KeyD') move.right = false;
        });

        // Shooting
        document.addEventListener('mousedown', e => {
            let bulletGeo = new THREE.SphereGeometry(0.1, 8, 8);
            let bulletMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            let bullet = new THREE.Mesh(bulletGeo, bulletMat);
            bullet.position.copy(camera.position);
            bullet.velocity = new THREE.Vector3();
            camera.getWorldDirection(bullet.velocity);
            bullet.velocity.multiplyScalar(30);
            bullets.push(bullet);
            scene.add(bullet);
        });

        // Spawn enemies
        function spawnEnemy() {
            let enemyGeo = new THREE.BoxGeometry(1, 1, 1);
            let enemyMat = new THREE.MeshStandardMaterial({ color: 0x0000ff });
            let enemy = new THREE.Mesh(enemyGeo, enemyMat);
            enemy.position.set((Math.random() - 0.5) * 40, 0.5, (Math.random() - 0.5) * 40);
            enemy.health = 1;
            enemies.push(enemy);
            scene.add(enemy);
        }
        for (let i = 0; i < 10; i++) spawnEnemy();

        // Animate
        function animate() {
            requestAnimationFrame(animate);
            let delta = clock.getDelta();
            let speed = 5 * delta;

            // Player movement
            let dir = new THREE.Vector3();
            if (move.forward) dir.z -= speed;
            if (move.backward) dir.z += speed;
            if (move.left) dir.x -= speed;
            if (move.right) dir.x += speed;
            controls.moveRight(dir.x);
            controls.moveForward(dir.z);

            // Bullets
            bullets.forEach((b, i) => {
                b.position.add(b.velocity.clone().multiplyScalar(delta));
                if (b.position.length() > 100) { scene.remove(b); bullets.splice(i, 1); }
                enemies.forEach((e, j) => {
                    if (b.position.distanceTo(e.position) < 0.75) {
                        scene.remove(e);
                        enemies.splice(j, 1);
                        scene.remove(b);
                        bullets.splice(i, 1);
                        score += 1;
                        document.getElementById('score').innerText = "Score: " + score;
                    }
                });
            });

            // Enemy AI (chase player)
            enemies.forEach(e => {
                let dirToPlayer = new THREE.Vector3();
                dirToPlayer.subVectors(camera.position, e.position).normalize();
                e.position.add(dirToPlayer.multiplyScalar(delta * 2));
            });

            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

        walls[walls.length - 1].position.set(0, 2.5, 25);

        walls[walls.length - 1].position.set(-25, 2.5, 0);
        walls.push(new THREE.Mesh(new THREE.BoxGeometry(1, 5, 50), wallMat)); // right

            if (e.code == 'KeyA') move.left = false;

        let score = 0;

        let clock = new THREE.Clock();

                        scene.remove(e); enemies.splice(j, 1);
