<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript Strings method</h2>
<P>Basic Methods</P>
<script>
    //methodname()
    //string , Number , Boolean (true or false)
    //toUpperCase() it is used to convert upper case into lower case
    //toLowerCase()
    let str ="Hello World";
    document.write(str.toUpperCase());
    document.write("<Br>");
    document.write(str.toLowerCase());
    document.write("<Br>");
    document.write("<Br>");
    document.write(str.startsWith("o"));
    document.write("<Br>");
    document.write(Math.random());
    document.write("<Br>");
    document.write(Math.floor(5.999))
</script>
</body>
</html>
