<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H2>Js in detail</H2>

    <script>
        // use of typeof operator.
let name = "john";
let num = 5;
let x = 5

document.write(typeof(name));
document.write("<br>");
    document.write(typeof (num));
    document.write("<br>");
    document.write(typeof (x));
    document.write("<br>");
    //use of strings()
    //string() is a method which changes your data type into string.

    let a = 4;
    let b = 5   

    document.write(a+b);
    document.write("<br>");
    document.write(String(a)+String(b)); //do not add beacuse it is a string ut concatentes
    document.write("<br>");
    //use of search()

    let sentence = "Fall in love with coding";

    document.write(sentence.search("in"))  ;
    document.write("<br>");
    </script>
</body>
