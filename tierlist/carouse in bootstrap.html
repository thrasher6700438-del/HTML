<body>
    <div class="container"
    <h2>Carouse example:</h2>

data-ride="carouse1"></div>
<ol class="carousel-indicators">

<div class="carouse1-inner">

<img src="i1.jpeg" alt="image 1">

                <a class="left carousel- control" href="#mycarouse1" data-slide="prev">
                    slide="prev">
